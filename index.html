<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Cumpleaños - Humberto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #1a202c;
            overflow-x: hidden;
        }
        
        .font-display {
            font-family: 'Fredoka One', cursive;
        }

        /* Custom Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        @keyframes stomp {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(5px) scaleY(0.95); }
        }

        @keyframes leaf-sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-wiggle { animation: wiggle 3s ease-in-out infinite; }
        .animate-stomp { animation: stomp 0.5s ease-in-out infinite; }
        .animate-leaf { animation: leaf-sway 4s ease-in-out infinite; }

        /* Texture overlay */
        .texture-overlay {
            background-image: url("data:image/svg+xml,%3Csvg width='6' height='6' viewBox='0 0 6 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%239C92AC' fill-opacity='0.1' fill-rule='evenodd'%3E%3Cpath d='M5 0h1L0 6V5zM6 5v1H5z'/%3E%3C/g%3E%3C/svg%3E");
        }

        /* 3D Card Effect */
        .card-container {
            perspective: 1000px;
        }
        
        .invitation-card {
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .invitation-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative selection:bg-green-500 selection:text-white">

    <!-- Background Elements -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <!-- Sun/Moon -->
        <div class="absolute top-10 right-10 w-32 h-32 bg-yellow-300 rounded-full blur-2xl opacity-60 animate-pulse"></div>
        <!-- Mountains -->
        <div class="absolute bottom-0 w-full h-64 bg-green-900 opacity-30" style="clip-path: polygon(0% 100%, 0% 40%, 20% 60%, 40% 30%, 60% 50%, 80% 20%, 100% 40%, 100% 100%);"></div>
        <div class="absolute bottom-0 w-full h-48 bg-green-800 opacity-40" style="clip-path: polygon(0% 100%, 0% 60%, 30% 40%, 50% 70%, 70% 50%, 100% 80%, 100% 100%);"></div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <div class="card-container w-full max-w-md p-4 z-10">
        <div id="card" class="invitation-card relative w-full aspect-[3/5] cursor-pointer group">
            
            <!-- FRONT OF CARD -->
            <div class="card-face absolute inset-0 w-full h-full bg-amber-50 rounded-3xl shadow-2xl border-8 border-amber-200 overflow-hidden flex flex-col">
                <!-- Texture -->
                <div class="absolute inset-0 texture-overlay opacity-50"></div>
                
                <!-- Decorative Border -->
                <div class="absolute inset-2 border-4 border-dashed border-green-600 rounded-2xl opacity-30 pointer-events-none"></div>

                <!-- Header -->
                <div class="relative pt-8 text-center z-10">
                    <h2 class="text-green-700 text-xl font-bold tracking-widest uppercase mb-2 opacity-80">Estás Invitado</h2>
                    <div class="flex justify-center space-x-2 mb-4">
                        <span class="text-2xl animate-bounce" style="animation-delay: 0s">🦕</span>
                        <span class="text-2xl animate-bounce" style="animation-delay: 0.2s">🌿</span>
                        <span class="text-2xl animate-bounce" style="animation-delay: 0.4s">🦖</span>
                    </div>
                </div>

                <!-- Main Visual: Dinosaur -->
                <div class="flex-grow flex items-center justify-center relative z-10">
                    <!-- Dino SVG -->
                    <svg class="w-64 h-64 animate-float drop-shadow-2xl" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Body -->
                        <path d="M40 140 C 20 140, 20 100, 50 90 C 60 50, 100 40, 130 60 C 150 70, 160 90, 150 110 C 160 130, 140 150, 110 150 L 40 150 Z" fill="#4ADE80" stroke="#166534" stroke-width="4"/>
                        <!-- Belly -->
                        <path d="M60 140 C 50 140, 50 110, 70 100 C 80 80, 110 80, 120 100 C 130 110, 120 140, 100 140 Z" fill="#86EFAC" opacity="0.6"/>
                        <!-- Eye -->
                        <circle cx="110" cy="75" r="5" fill="white"/>
                        <circle cx="112" cy="75" r="2" fill="black"/>
                        <!-- Pupil highlight -->
                        <circle cx="113" cy="74" r="1" fill="white"/>
                        <!-- Smile -->
                        <path d="M105 85 Q 115 90 125 85" stroke="#166534" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <!-- Spikes -->
                        <path d="M60 50 L 55 30 L 70 45 Z" fill="#22C55E"/>
                        <path d="M80 42 L 80 20 L 95 40 Z" fill="#22C55E"/>
                        <path d="M100 45 L 110 25 L 120 48 Z" fill="#22C55E"/>
                        <!-- Arm -->
                        <path d="M100 110 Q 90 120 80 115" stroke="#166534" stroke-width="4" stroke-linecap="round" fill="none"/>
                        <!-- Legs -->
                        <path d="M70 150 L 70 170 L 50 170" stroke="#166534" stroke-width="5" stroke-linecap="round" fill="none"/>
                        <path d="M110 150 L 110 170 L 130 170" stroke="#166534" stroke-width="5" stroke-linecap="round" fill="none"/>
                    </svg>
                    
                    <!-- Speech Bubble -->
                    <div class="absolute top-10 right-4 bg-white px-4 py-2 rounded-xl rounded-bl-none shadow-lg border-2 border-green-200 animate-wiggle">
                        <p class="text-green-800 font-bold text-sm">¡ROAR!</p>
                    </div>
                </div>

                <!-- Name -->
                <div class="relative z-10 text-center pb-12">
                    <h1 class="font-display text-6xl text-green-600 drop-shadow-md transform -rotate-2">Humber</h1>
                    <p class="text-amber-700 font-bold mt-2 text-lg">Cumple Años</p>
                </div>

                <!-- Click Hint -->
                <div class="absolute bottom-4 w-full text-center text-amber-800/50 text-xs font-bold uppercase tracking-widest animate-pulse">
                    Toca para abrir
                </div>
            </div>

            <!-- BACK OF CARD -->
            <div class="card-back card-face absolute inset-0 w-full h-full bg-green-50 rounded-3xl shadow-2xl border-8 border-green-200 overflow-hidden flex flex-col p-6">
                 <!-- Texture -->
                 <div class="absolute inset-0 texture-overlay opacity-50"></div>

                 <!-- Header Back -->
                 <div class="text-center mb-6 relative z-10">
                     <div class="inline-block bg-green-600 text-white px-4 py-1 rounded-full text-sm font-bold tracking-wider shadow-md mb-2">DETALLES</div>
                     <h3 class="font-display text-3xl text-green-800">¡Nos vemos!</h3>
                 </div>

                 <!-- Content -->
                 <div class="flex-grow flex flex-col justify-center space-y-6 relative z-10">
                     
                     <!-- Date Block -->
                     <div class="bg-white/80 backdrop-blur-sm p-4 rounded-2xl border-2 border-green-100 shadow-sm transform hover:scale-105 transition-transform duration-300">
                         <div class="flex items-center space-x-3">
                             <div class="bg-green-100 p-2 rounded-full text-2xl">📅</div>
                             <div>
                                 <p class="text-xs text-green-600 font-bold uppercase">Fecha</p>
                                 <p class="text-xl font-bold text-gray-800">31 de Febrero</p>
                                 <p class="text-xs text-gray-500">5:00 PM</p>
                             </div>
                         </div>
                     </div>

                     <!-- Location Block -->
                     <div class="bg-white/80 backdrop-blur-sm p-4 rounded-2xl border-2 border-green-100 shadow-sm transform hover:scale-105 transition-transform duration-300">
                        <div class="flex items-center space-x-3">
                            <div class="bg-amber-100 p-2 rounded-full text-2xl">📍</div>
                            <div>
                                <p class="text-xs text-amber-600 font-bold uppercase">Ubicación</p>
                                <p class="text-lg font-bold text-gray-800 leading-tight">José Robledo 103# A</p>
                                <a href="https://www.google.com/maps/place/C.+Jos%C3%A9+Robledo+Ram%C3%ADrez+103,+Revoluci%C3%B3n,+47540+Ojuelos+de+Jalisco,+Jal./@21.8716232,-101.5963979,18.2z/data=!4m6!3m5!1s0x842a699fb310fe0f:0x1941d59a556ebbfe!8m2!3d21.872167!4d-101.5958394!16s%2Fg%2F11c24b7x93?entry=ttu&g_ep=EgoyMDI2MDEyNS4wIKXMDSoKLDEwMDc5MjA3M0gBUAM%3D" target="_blank" class="text-xs text-blue-500 hover:underline mt-1 inline-block">Ver en mapa &rarr;</a>
                            </div>
                        </div>
                    </div>

                    <!-- RSVP Block -->
                    <div class="text-center pt-2">
                      <!--  <p class="text-green-800 font-semibold text-sm mb-2">¿Vienes a la aventura jurásica?</p>
                        <button onclick="event.stopPropagation(); alert('¡Gracias por confirmar! 🦖');" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-full shadow-lg transform active:scale-95 transition-all border-b-4 border-green-700">
                            Confirmar Asistencia
                        </button> -->
                    </div>

                 </div>

                 <!-- Footer Decoration -->
                 <div class="mt-auto flex justify-between items-end opacity-60">
                     <svg class="w-12 h-12 text-green-300 animate-leaf" fill="currentColor" viewBox="0 0 24 24"><path d="M17,8C8,10,5.9,16.17,3.82,21.34L5.71,22l1-2.3A4.49,4.49,0,0,0,8,20C19,20,22,3,22,3,21,5,14,5.25,9,6.25S2,11.5,2,13.5a6.22,6.22,0,0,0,1.75,3.75C7,13,11,9,17,8Z"/></svg>
                     <svg class="w-10 h-10 text-green-300 animate-leaf" style="animation-delay: 1s" fill="currentColor" viewBox="0 0 24 24"><path d="M17,8C8,10,5.9,16.17,3.82,21.34L5.71,22l1-2.3A4.49,4.49,0,0,0,8,20C19,20,22,3,22,3,21,5,14,5.25,9,6.25S2,11.5,2,13.5a6.22,6.22,0,0,0,1.75,3.75C7,13,11,9,17,8Z"/></svg>
                 </div>
            </div>

        </div>
    </div>

    <script>
        // Card Flip Logic
        const card = document.getElementById('card');
        let isFlipped = false;

        card.addEventListener('click', () => {
            isFlipped = !isFlipped;
            if (isFlipped) {
                card.classList.add('flipped');
                startConfetti();
            } else {
                card.classList.remove('flipped');
            }
        });

        // Confetti Logic
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.size = Math.random() * 10 + 5;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 5 - 2.5;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function startConfetti() {
            // Reset particles
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
            
            if (animationId) cancelAnimationFrame(animationId);
            animateConfetti();
            
            // Stop after 3 seconds
            setTimeout(() => {
                cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 3000);
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
            if (particles.length > 0) {
                animationId = requestAnimationFrame(animateConfetti);
            }
        }
    </script>
</body>
</html>
