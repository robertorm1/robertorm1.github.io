<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitación de Cumpleaños - Humberto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #1a202c;
            overflow-x: hidden;
            position: fixed;
            height: 100%;
            width: 100%;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }
        
        .font-display { font-family: 'Fredoka One', cursive; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-wiggle { animation: wiggle 3s ease-in-out infinite; }

        .card-container {
            perspective: 1000px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .invitation-card {
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            max-width: 320px;
            height: 85vh;
            max-height: 600px;
            cursor: pointer;
        }

        .invitation-card.flipped { transform: rotateY(180deg); }

        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            position: absolute;
            inset: 0;
            border-radius: 24px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: opacity 0s 0.4s; /* espera a que termine el giro */
        }

        .card-back { 
            transform: rotateY(180deg); 
            overflow-y: auto;
        }

        /* Oculta la cara NO visible */
        .invitation-card.flipped .card-face.card-front {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        .invitation-card:not(.flipped) .card-face.card-back {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .touch-feedback:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen relative selection:bg-green-500 selection:text-white">

    <canvas id="confetti-canvas"></canvas>

    <div class="card-container">
        <div id="card" class="invitation-card touch-feedback">
            
            <!-- FRONT -->
            <div class="card-face card-front absolute inset-0 w-full h-full bg-amber-50 rounded-3xl shadow-2xl border-8 border-amber-200 overflow-hidden flex flex-col">
                <div class="absolute inset-0 texture-overlay opacity-50"></div>
                <div class="absolute inset-2 border-4 border-dashed border-green-600 rounded-2xl opacity-30 pointer-events-none"></div>

                <!-- Header -->
                <div class="relative pt-6 text-center z-10">
                    <h2 class="text-green-700 text-lg font-bold tracking-widest uppercase mb-2 opacity-80">Estás Invitado</h2>
                    <div class="flex justify-center space-x-2 mb-3">
                        <span class="text-xl animate-bounce">🦕</span>
                        <span class="text-xl animate-bounce" style="animation-delay: 0.2s">🌿</span>
                        <span class="text-xl animate-bounce" style="animation-delay: 0.4s">🦖</span>
                    </div>
                </div>

                <!-- Main Visual: Dinosaur -->
                <div class="flex-grow flex items-center justify-center relative z-10">
                    <svg class="w-48 h-48 animate-float drop-shadow-2xl" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Body -->
                        <path d="M40 140 C 20 140, 20 100, 50 90 C 60 50, 100 40, 130 60 C 150 70, 160 90, 150 110 C 160 130, 140 150, 110 150 L 40 150 Z" fill="#4ADE80" stroke="#166534" stroke-width="4"/>
                        <!-- Belly -->
                        <path d="M60 140 C 50 140, 50 110, 70 100 C 80 80, 110 80, 120 100 C 130 110, 120 140, 100 140 Z" fill="#86EFAC" opacity="0.6"/>
                        <!-- Eye -->
                        <circle cx="110" cy="75" r="5" fill="white"/>
                        <circle cx="112" cy="75" r="2" fill="black"/>
                        <circle cx="113" cy="74" r="1" fill="white"/>
                        <!-- Smile -->
                        <path d="M105 85 Q 115 90 125 85" stroke="#166534" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <!-- Spikes -->
                        <path d="M60 50 L 55 30 L 70 45 Z" fill="#22C55E"/>
                        <path d="M80 42 L 80 20 L 95 40 Z" fill="#22C55E"/>
                        <path d="M100 45 L 110 25 L 120 48 Z" fill="#22C55E"/>
                        <!-- Arm -->
                        <path d="M100 110 Q 90 120 80 115" stroke="#166534" stroke-width="4" stroke-linecap="round" fill="none"/>
                        <!-- Legs -->
                        <path d="M70 150 L 70 170 L 50 170" stroke="#166534" stroke-width="5" stroke-linecap="round" fill="none"/>
                        <path d="M110 150 L 110 170 L 130 170" stroke="#166534" stroke-width="5" stroke-linecap="round" fill="none"/>
                    </svg>
                    
                    <div class="absolute top-8 right-2 bg-white px-3 py-2 rounded-xl rounded-bl-none shadow-lg border-2 border-green-200 animate-wiggle">
                        <p class="text-green-800 font-bold text-xs">¡ROAR!</p>
                    </div>
                </div>

                <!-- Name -->
                <div class="relative z-10 text-center pb-8">
                    <h1 class="font-display text-4xl text-green-600 drop-shadow-md transform -rotate-2">Humber</h1>
                    <p class="text-amber-700 font-bold mt-1 text-base">Cumple Años</p>
                </div>

                <div class="absolute bottom-4 w-full text-center text-amber-800/50 text-xs font-bold uppercase tracking-widest animate-pulse">
                    Toca para abrir
                </div>
            </div>

            <!-- BACK -->
            <div class="card-back card-face absolute inset-0 w-full h-full bg-green-50 rounded-3xl shadow-2xl border-8 border-green-200 overflow-hidden flex flex-col p-4">
                 <div class="absolute inset-0 texture-overlay opacity-50"></div>

                 <div class="text-center mb-4 relative z-10">
                     <div class="inline-block bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold tracking-wider shadow-md mb-1">DETALLES</div>
                     <h3 class="font-display text-2xl text-green-800">¡Nos vemos!</h3>
                 </div>

                 <div class="flex-grow flex flex-col justify-center space-y-4 relative z-10">
                     
                     <!-- Date Block (CORRECTED) -->
                     <div class="bg-white/80 backdrop-blur-sm p-3 rounded-2xl border-2 border-green-100 shadow-sm">
                         <div class="flex items-center space-x-3">
                             <div class="bg-green-100 p-2 rounded-full text-xl">📅</div>
                             <div>
                                 <p class="text-xs text-green-600 font-bold uppercase">Fecha</p>
                                 <p class="text-lg font-bold text-gray-800">Sabado 31 de Enero</p>
                                 <p class="text-xs text-gray-500">4:30 PM</p>
                             </div>
                         </div>
                     </div>

                     <!-- Location Block -->
                     <div class="bg-white/80 backdrop-blur-sm p-3 rounded-2xl border-2 border-green-100 shadow-sm">
                        <div class="flex items-center space-x-3">
                            <div class="bg-amber-100 p-2 rounded-full text-xl">📍</div>
                            <div>
                                <p class="text-xs text-amber-600 font-bold uppercase">Ubicación</p>
                                <p class="text-base font-bold text-gray-800 leading-tight">José Robledo 103# A</p>
                                <a href="https://maps.app.goo.gl/QC62zvzyypXFEoEQ6" target="_blank" class="text-xs text-blue-500 hover:underline mt-1 inline-block">Ver en mapa &rarr;</a>
                            </div>
                        </div>
                    </div>

                    <!-- RSVP Block -->
                    <div class="text-center pt-2">
                        <!-- <p class="text-green-800 font-semibold text-sm mb-2">¿Vienes a la aventura jurásica?</p> -->
                        <button onclick="event.stopPropagation(); alert('¡Gracias por confirmar! 🦖');" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-full shadow-lg border-b-4 border-green-700">
                            Te esperamos
                        </button>
                    </div>

                 </div>

                 <div class="mt-auto flex justify-between items-end opacity-60">
                     <svg class="w-8 h-8 text-green-300" fill="currentColor" viewBox="0 0 24 24"><path d="M17,8C8,10,5.9,16.17,3.82,21.34L5.71,22l1-2.3A4.49,4.49,0,0,0,8,20C19,20,22,3,22,3,21,5,14,5.25,9,6.25S2,11.5,2,13.5a6.22,6.22,0,0,0,1.75,3.75C7,13,11,9,17,8Z"/></svg>
                     <svg class="w-6 h-6 text-green-300" fill="currentColor" viewBox="0 0 24 24"><path d="M17,8C8,10,5.9,16.17,3.82,21.34L5.71,22l1-2.3A4.49,4.49,0,0,0,8,20C19,20,22,3,22,3,21,5,14,5.25,9,6.25S2,11.5,2,13.5a6.22,6.22,0,0,0,1.75,3.75C7,13,11,9,17,8Z"/></svg>
                 </div>
            </div>

        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        let isFlipped = false;

        card.addEventListener('click', () => {
            isFlipped = !isFlipped;
            isFlipped ? card.classList.add('flipped') : card.classList.remove('flipped');
            if (isFlipped) startConfetti();
        });

        // Touch support
        let touchStartY = 0;
        card.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY);
        card.addEventListener('touchend', e => {
            const diff = Math.abs(touchStartY - e.changedTouches[0].clientY);
            if (diff < 10) {
                e.preventDefault();
                isFlipped = !isFlipped;
                isFlipped ? card.classList.add('flipped') : card.classList.remove('flipped');
                if (isFlipped) startConfetti();
            }
        });

        // Confetti
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [], animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.size = Math.random() * 10 + 5;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 5 - 2.5;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function startConfetti() {
            particles = [];
            for (let i = 0; i < 100; i++) particles.push(new Particle());
            if (animationId) cancelAnimationFrame(animationId);
            animateConfetti();
            setTimeout(() => {
                cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 3000);
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.y > canvas.height) particles.splice(index, 1);
            });
            if (particles.length > 0) animationId = requestAnimationFrame(animateConfetti);
        }

        // Prevent zoom on double tap
        let lastTap = 0;
        card.addEventListener('touchend', e => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 500 && tapLength > 0) e.preventDefault();
            lastTap = currentTime;
        });

        // Handle orientation change
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
    </script>
</body>
</html>
