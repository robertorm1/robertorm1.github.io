<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarjeta de Cumpleaños 🎉</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Parisienne&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
      background: linear-gradient(135deg, #d147a0, #ff9ecb, #ffb6c1);
      color: #7c2d5f;
      text-align: center;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      width: 100%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Estrellas en el fondo */
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 3s infinite;
      -webkit-animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @-webkit-keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .header {
      margin-bottom: 30px;
      width: 100%;
    }

    /* Título mejorado */
    .birthday-title {
      margin: 30px 0 20px;
      text-align: center;
      position: relative;
      padding: 15px 0;
    }

    .birthday-text {
      font-family: 'Dancing Script', cursive;
      font-size: 4.5rem;
      color: #ff007f;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
      line-height: 1.2;
      margin-bottom: 10px;
      position: relative;
      display: inline-block;
    }

    /* Gradiente de texto con mejor compatibilidad */
    @supports (-webkit-background-clip: text) or (background-clip: text) {
      .birthday-text {
        background: linear-gradient(45deg, #ff007f, #ff4d9a, #ff80bf);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
    }

    .birthday-text::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(to right, transparent, #ff007f, transparent);
      border-radius: 50%;
    }

    .prima-text {
      font-family: 'Parisienne', cursive;
      font-size: 3.2rem;
      color: #d147a0;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.7);
      letter-spacing: 2px;
      display: block;
      margin-top: 5px;
      position: relative;
    }

    .prima-text::before, .prima-text::after {
      content: "✨";
      margin: 0 15px;
      font-size: 1.8rem;
      vertical-align: middle;
    }

    .decoration {
      position: absolute;
      font-size: 2rem;
      opacity: 0.7;
      z-index: -1;
    }

    .decoration-1 {
      top: -20px;
      left: -30px;
      animation: floatDecoration 8s infinite ease-in-out;
      -webkit-animation: floatDecoration 8s infinite ease-in-out;
    }

    .decoration-2 {
      top: -10px;
      right: -40px;
      animation: floatDecoration 10s infinite ease-in-out;
      -webkit-animation: floatDecoration 10s infinite ease-in-out;
    }

    .decoration-3 {
      bottom: -5px;
      left: 20%;
      animation: floatDecoration 9s infinite ease-in-out reverse;
      -webkit-animation: floatDecoration 9s infinite ease-in-out reverse;
    }

    .decoration-4 {
      bottom: 0;
      right: 25%;
      animation: floatDecoration 7s infinite ease-in-out reverse;
      -webkit-animation: floatDecoration 7s infinite ease-in-out reverse;
    }

    @keyframes floatDecoration {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(10deg); }
    }
    @-webkit-keyframes floatDecoration {
      0%, 100% { -webkit-transform: translateY(0) rotate(0deg); }
      50% { -webkit-transform: translateY(-15px) rotate(10deg); }
    }

    /* Pastel de 2 pisos */
    .cake-container {
      perspective: 300px;
      -webkit-perspective: 300px;
      margin: 20px auto 40px auto;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .cake {
      width: 160px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }

    .cake:hover {
      transform: rotateY(15deg) scale(1.05);
      -webkit-transform: rotateY(15deg) scale(1.05);
    }

    .tier {
      margin: 0 auto;
      border-radius: 0 0 20px 20px;
      position: relative;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .tier1 {
      width: 160px;
      height: 60px;
      background: linear-gradient(to right, #e83a9b, #d147a0);
    }

    .tier2 {
      width: 120px;
      height: 50px;
      background: linear-gradient(to right, #ff9ecb, #ff85b8);
      top: -10px;
      position: relative;
    }

    .glaze {
      position: absolute;
      width: 100%;
      height: 15px;
      background: #fffbeb;
      border-radius: 10px;
      top: -10px;
      left: 0;
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
    }

    .candle {
      width: 14px;
      height: 40px;
      background: linear-gradient(to bottom, #f0f0f0, #d9d9d9);
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      -webkit-transform: translateX(-50%);
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .flame {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle, #ffde82 10%, #ff9a3d 50%, #ff7a00 90%);
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      -webkit-transform: translateX(-50%);
      animation: flicker 0.4s infinite;
      -webkit-animation: flicker 0.4s infinite;
      box-shadow: 0 0 15px #ff7a00, 0 0 30px #ff9a3d;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); opacity: 1; }
      50% { transform: translateX(-50%) scale(1.3) rotate(5deg); opacity: 0.8; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }
    @-webkit-keyframes flicker {
      0% { -webkit-transform: translateX(-50%) scale(1); opacity: 1; }
      50% { -webkit-transform: translateX(-50%) scale(1.3) rotate(5deg); opacity: 0.8; }
      100% { -webkit-transform: translateX(-50%) scale(1); opacity: 1; }
    }

    button {
      background: linear-gradient(to right, #e83a9b, #ff6b6b);
      border: none;
      color: white;
      padding: 15px 30px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      margin-top: 20px;
      font-size: 1.1rem;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: linear-gradient(to right, #ff6b6b, #e83a9b);
      transform: translateY(-5px) scale(1.05);
      -webkit-transform: translateY(-5px) scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    /* Efecto de latido para el texto */
    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @-webkit-keyframes heartbeat {
      0% { -webkit-transform: scale(1); }
      50% { -webkit-transform: scale(1.1); }
      100% { -webkit-transform: scale(1); }
    }

    .heartbeat {
      animation: heartbeat 2s infinite;
      -webkit-animation: heartbeat 2s infinite;
      display: inline-block;
    }

    /* Animación de entrada */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @-webkit-keyframes fadeIn {
      from { opacity: 0; -webkit-transform: translateY(20px); }
      to { opacity: 1; -webkit-transform: translateY(0); }
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
      -webkit-animation: fadeIn 1s ease-out forwards;
    }

    .delay-1 { animation-delay: 0.3s; -webkit-animation-delay: 0.3s; }
    .delay-2 { animation-delay: 0.6s; -webkit-animation-delay: 0.6s; }
    .delay-3 { animation-delay: 0.9s; -webkit-animation-delay: 0.9s; }

    .birthday-wish {
      margin-top: 20px;
      font-size: 1.6rem;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      padding: 20px;
      line-height: 1.6;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      font-weight: bold;
      font-style: italic;
      color: #7c2d5f;
    }

    /* Soporte para backdrop-filter */
    @supports (backdrop-filter: blur(5px)) or (-webkit-backdrop-filter: blur(5px)) {
      .birthday-wish {
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
      }
    }

    /* Flores decorativas */
    .flower {
      position: absolute;
      font-size: 24px;
      opacity: 0.7;
      z-index: -1;
      animation: floatFlower 15s infinite linear;
      -webkit-animation: floatFlower 15s infinite linear;
    }

    @keyframes floatFlower {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }
    @-webkit-keyframes floatFlower {
      0% {
        -webkit-transform: translateY(100vh) rotate(0deg);
        opacity: 0.7;
      }
      100% {
        -webkit-transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    /* Notificación de sonido */
    .sound-notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 15px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      transform: translateY(150%);
      transition: transform 0.5s ease;
      -webkit-transition: transform 0.5s ease;
    }

    .sound-notification.show {
      transform: translateY(0);
      -webkit-transform: translateY(0);
    }

    .sound-notification button {
      margin: 0;
      padding: 5px 10px;
      font-size: 0.8rem;
    }

    /* Mensaje de error para confeti */
    .confetti-error {
      display: none;
      margin-top: 15px;
      color: #7c2d5f;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .birthday-text {
        font-size: 3.2rem;
      }
      
      .prima-text {
        font-size: 2.5rem;
      }
      
      .cake {
        transform: scale(0.9);
        -webkit-transform: scale(0.9);
      }
      
      .birthday-wish {
        font-size: 1.3rem;
        padding: 15px;
      }
      
      .decoration {
        display: none;
      }
      
      .sound-notification {
        bottom: 10px;
        right: 10px;
        left: 10px;
        text-align: center;
        flex-direction: column;
        gap: 5px;
      }
      
      button {
        padding: 12px 25px;
      }
    }
    
    /* Solución para el problema de :hover en dispositivos táctiles */
    @media (hover: none) {
      .cake:hover {
        transform: none;
        -webkit-transform: none;
      }
      
      button:hover {
        transform: none;
        -webkit-transform: none;
        background: linear-gradient(to right, #e83a9b, #ff6b6b);
      }
    }
  </style>
</head>
<body>
  <!-- Notificación de sonido -->
  <div class="sound-notification" id="soundNotification">
    <span>¿Quieres activar los sonidos para una mejor experiencia?</span>
    <button id="enableSound">Activar sonidos</button>
  </div>

  <!-- Estrellas -->
  <script>
    // Crear estrellas de forma compatible
    document.addEventListener('DOMContentLoaded', function() {
      for(let i=0; i<100; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.top = Math.random() * window.innerHeight + 'px';
        star.style.left = Math.random() * window.innerWidth + 'px';
        star.style.animationDuration = (2 + Math.random()*3) + 's';
        document.body.appendChild(star);
      }

      // Agregar flores flotantes
      for(let i=0; i<15; i++) {
        const flower = document.createElement('div');
        flower.classList.add('flower');
        flower.innerHTML = '🌸';
        flower.style.left = Math.random() * window.innerWidth + 'px';
        flower.style.animationDuration = (10 + Math.random()*20) + 's';
        flower.style.animationDelay = Math.random()*10 + 's';
        flower.style.fontSize = (15 + Math.random()*20) + 'px';
        document.body.appendChild(flower);
      }
    });
  </script>

  <div class="container">
    <div class="header">
      <div class="birthday-title fade-in">
        <div class="decoration decoration-1">🎀</div>
        <div class="decoration decoration-2">🎊</div>
        <div class="birthday-text">Feliz cumpleaños</div>
        <span class="prima-text">Prima</span>
        <div class="decoration decoration-3">💖</div>
        <div class="decoration decoration-4">🎁</div>
      </div>
    </div>

    <div class="cake-container fade-in delay-2">
      <div class="cake">
        <div class="tier tier2">
          <div class="glaze"></div>
          <div class="candle">
            <div class="flame"></div>
          </div>
        </div>
        <div class="tier tier1">
          <div class="glaze"></div>
        </div>
      </div>
    </div>
    
    <div class="birthday-wish fade-in delay-3">
      <p>Eres una persona muy especial, que merece todo lo mejor</p>
    </div>
    
    <button id="surpriseBtn" class="fade-in delay-3">Sorpresa Especial</button>
    <p class="confetti-error" id="confettiError">Si no ves los efectos de confeti, intenta actualizar la página.</p>
  </div>

  <script>
    // Solución para problemas de audio en iOS
    let audioContext;
    
    // Función para inicializar el contexto de audio
    function initAudioContext() {
      if (!audioContext) {
        try {
          // Crear contexto de audio (compatible con iOS)
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioContext = new AudioContext();
          
          // Reanudar el contexto si está suspendido (requerido por iOS)
          if (audioContext.state === 'suspended') {
            audioContext.resume();
          }
        } catch (e) {
          console.error('Error inicializando audio:', e);
        }
      }
    }
    
    // Sonidos reales (usando URLs externas por simplicidad)
    const candleBlowSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-blowing-candle-3161.mp3');
    const celebrationSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-fun-party-103.mp3');
    
    // Configurar los sonidos
    [candleBlowSound, celebrationSound].forEach(sound => {
      sound.volume = 0.6;
      sound.preload = 'auto';
    });

    let soundEnabled = false; // Inicialmente desactivado hasta que el usuario decida
    let candlesBlown = false;

    // Mostrar notificación de sonido después de un retraso
    setTimeout(() => {
      const notification = document.getElementById('soundNotification');
      if (notification && !localStorage.getItem('soundPreferenceSet')) {
        notification.classList.add('show');
      }
    }, 3000);

    // Configurar confeti con la biblioteca
    function fireConfetti() {
      // Verificar si la biblioteca de confeti está cargada
      if (typeof confetti === 'function') {
        try {
          confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#ff6b6b', '#ffd93d', '#6bcbef', '#845ef7', '#34d399', '#ff9ecb', '#d147a0']
          });
        } catch (e) {
          console.error('Error con confeti:', e);
          document.getElementById('confettiError').style.display = 'block';
        }
      } else {
        document.getElementById('confettiError').style.display = 'block';
      }
    }

    function fireWorks() {
      // Verificar si la biblioteca de confeti está cargada
      if (typeof confetti !== 'function') {
        document.getElementById('confettiError').style.display = 'block';
        return;
      }
      
      try {
        const duration = 5 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) {
          return Math.random() * (max - min) + min;
        }

        const interval = setInterval(function() {
          const timeLeft = animationEnd - Date.now();

          if (timeLeft <= 0) {
            return clearInterval(interval);
          }

          const particleCount = 50 * (timeLeft / duration);
          
          // Disparar desde la izquierda
          confetti(Object.assign({}, defaults, {
            particleCount,
            origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
          }));
          
          // Disparar desde la derecha
          confetti(Object.assign({}, defaults, {
            particleCount,
            origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
          }));
        }, 250);
      } catch (e) {
        console.error('Error con confeti:', e);
        document.getElementById('confettiError').style.display = 'block';
      }
    }

    // Función para reproducir sonido con manejo de errores
    function playSound(sound) {
      if (!soundEnabled) return;
      
      try {
        // Inicializar contexto de audio si es necesario
        initAudioContext();
        
        sound.currentTime = 0;
        const playPromise = sound.play();
        
        if (playPromise !== undefined) {
          playPromise.catch(e => {
            console.log("Error reproduciendo sonido:", e);
            // Si falla, desactivar sonidos para futuros intentos
            soundEnabled = false;
          });
        }
      } catch (e) {
        console.log("Error con el sonido:", e);
        soundEnabled = false;
      }
    }

    // Esperar a que el DOM esté completamente cargado
    document.addEventListener('DOMContentLoaded', function() {
      const cake = document.querySelector('.cake');
      const surpriseBtn = document.getElementById('surpriseBtn');
      const enableSoundBtn = document.getElementById('enableSound');
      
      // Configurar botón de activar sonido
      if (enableSoundBtn) {
        enableSoundBtn.addEventListener('click', function() {
          soundEnabled = true;
          localStorage.setItem('soundPreferenceSet', 'true');
          document.getElementById('soundNotification').classList.remove('show');
          
          // Inicializar el contexto de audio
          initAudioContext();
          
          // Probar reproduciendo un sonido breve
          playSound(celebrationSound);
          setTimeout(() => {
            celebrationSound.pause();
            celebrationSound.currentTime = 0;
          }, 500);
        });
      }
      
      // Solución para el evento de clic en iOS
      if (cake) {
        cake.addEventListener('click', function() {
          const flame = document.querySelector('.flame');
          
          if (flame.style.visibility !== 'hidden') {
            playSound(candleBlowSound);
            
            flame.style.visibility = 'hidden';
            document.querySelector('.candle').style.height = '20px';
            
            // Disparar mucho confeti al soplar la vela
            if (!candlesBlown) {
              fireWorks();
              playSound(celebrationSound);
              candlesBlown = true;
            }
          } else {
            flame.style.visibility = 'visible';
            document.querySelector('.candle').style.height = '40px';
          }
        });
        
        // Agregar evento táctil para dispositivos móviles
        cake.addEventListener('touchstart', function(e) {
          e.preventDefault();
          this.style.transform = 'rotateY(15deg) scale(1.05)';
        }, { passive: false });
        
        cake.addEventListener('touchend', function() {
          this.style.transform = '';
        });
      }
      
      if (surpriseBtn) {
        surpriseBtn.addEventListener('click', function() {
          fireWorks();
          playSound(celebrationSound);
          
          // Efecto especial para el botón de sorpresa
          if (typeof confetti === 'function') {
            try {
              confetti({
                particleCount: 300,
                angle: 60,
                spread: 80,
                origin: { x: 0 }
              });
              
              confetti({
                particleCount: 300,
                angle: 120,
                spread: 80,
                origin: { x: 1 }
              });
            } catch (e) {
              console.error('Error con confeti:', e);
              document.getElementById('confettiError').style.display = 'block';
            }
          }

          // Agregar más flores
          for(let i=0; i<10; i++) {
            const flower = document.createElement('div');
            flower.classList.add('flower');
            flower.innerHTML = '🌸';
            flower.style.left = Math.random() * window.innerWidth + 'px';
            flower.style.animationDuration = (8 + Math.random()*15) + 's';
            flower.style.fontSize = (20 + Math.random()*25) + 'px';
            document.body.appendChild(flower);
          }
        });
      }

      // Iniciar con un poco de confeti después de un breve retraso
      setTimeout(function() {
        fireConfetti();
      }, 1500);
      
      // Solución para el problema de reproducción automática en iOS
      document.body.addEventListener('touchstart', function() {
        initAudioContext();
      }, { once: true });
    });
  </script>
</body>
</html>
